<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fases da lua</title><link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@1&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<main class="widget"><header><div><small>ciclo lunar</small><h1>fases da lua</h1></div><button id="open">⚙</button></header><section class="today"><div id="bigMoon"></div><div><small>lua de hoje</small><h2 id="todayName"></h2><p id="illum"></p></div></section><hr><small>ciclo lunar</small><section id="phases"></section></main>
<dialog id="settings"><div class="panel"><header><h2>configurações</h2><button id="close">×</button></header><p>personalize as cores do widget.</p><div id="colors"></div><footer><button id="reset">restaurar cores</button><button id="save">salvar alterações</button></footer></div></dialog>
<dialog id="picker"><div class="panel"><header><h2 id="colorTitle">escolher cor</h2><button id="x">×</button></header><div class="pickgrid"><div><div id="square"><i></i></div><input id="hue" type="range" min="0" max="360"></div><div id="preview"></div></div><div class="vals"><label>matiz H<input id="H" type="number" min="0" max="360"></label><label>saturação S<input id="S" type="number" min="0" max="100"></label><label>brilho B<input id="V" type="number" min="0" max="100"></label></div><label>HEX<input id="HEX"></label><footer><button id="cancel">cancelar</button><button id="applyColorBtn">aplicar cor</button></footer></div></dialog><script src="script.js"></script></body></html>
